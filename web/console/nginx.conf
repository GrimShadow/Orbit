server {
  listen 8080;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Caching uses `expires` (not add_header) so the security headers above are never replaced inside a location.
  location /assets/ {
    expires 1y;            # hashed file names, safe to cache for a year
  }
  location / {
    expires epoch;         # index.html and other unhashed files: "Cache-Control: no-cache"
    try_files $uri /index.html;
  }
}
