name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
env:
  # Trivy runs from its official container, pinned by digest (the marketplace action's old tags are gone).
  TRIVY: aquasec/trivy@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - run: dotnet build Dam.sln -c Release
      # Integration tests use Testcontainers (Docker is preinstalled on ubuntu-latest).
      # They also fail if docs/api/openapi.json drifts from the running API (the OpenAPI diff check).
      - run: dotnet test Dam.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: dotnet-test-results, path: "**/TestResults/*.trx" }

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @dam/ui-kit build-storybook

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, actions: read, security-events: write }
    strategy:
      fail-fast: false
      matrix: { language: [csharp, javascript-typescript] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with: { global-json-file: global.json }
      - uses: github/codeql-action/init@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with: { languages: "${{ matrix.language }}", build-mode: "${{ matrix.language == 'csharp' && 'manual' || 'none' }}" }
      - if: matrix.language == 'csharp'
        run: dotnet build Dam.sln -c Release
      # Results go to the Security tab (free on public repos) and the job also fails on any error-level finding.
      # Dependabot PRs run with a read-only token and cannot upload, so they only get the in-job gate.
      - uses: github/codeql-action/analyze@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with: { upload: "${{ github.actor == 'dependabot[bot]' && 'never' || 'always' }}", output: sarif-results, category: "/language:${{ matrix.language }}" }
      - name: Fail on error-level findings
        run: |
          n=$(jq '[.runs[].results[] | select(.level=="error")] | length' sarif-results/*.sarif)
          echo "error-level CodeQL findings: $n"
          [ "$n" -eq 0 ]
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "codeql-${{ matrix.language }}", path: sarif-results }

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: { image: semgrep/semgrep:latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/default --config p/owasp-top-ten --config p/csharp --config p/typescript --error --metrics=off --exclude tests --exclude '**/*.test.tsx'

  # Dependency vulnerabilities (SCA), committed secrets and IaC misconfiguration in one pass; also emits a source SBOM.
  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies, secrets and IaC (fails on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/repo" "$TRIVY" fs /repo --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --skip-dirs node_modules,tests --exit-code 1
      - name: Source SBOM (CycloneDX)
        run: |
          docker run --rm -v "$PWD:/repo" "$TRIVY" fs /repo --format cyclonedx --output /repo/sbom-source.cdx.json \
            --skip-dirs node_modules,tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: sbom-source, path: sbom-source.cdx.json }

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/dam

  images:
    needs: [dotnet, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, file: deploy/docker/Dockerfile.dotnet, args: "PROJECT=Dam.Api" }
          - { name: worker, file: deploy/docker/Dockerfile.dotnet, args: "PROJECT=Dam.Worker" }
          - { name: scheduler, file: deploy/docker/Dockerfile.dotnet, args: "PROJECT=Dam.Scheduler" }
          - { name: console, file: web/console/Dockerfile, args: "" }
    steps:
      - name: Image name (Docker requires lowercase)
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64) for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          load: true
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Container scan (fails on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            scan/${{ matrix.name }}:${{ github.sha }} --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY" image \
            scan/${{ matrix.name }}:${{ github.sha }} --format cyclonedx --output /out/sbom-${{ matrix.name }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "sbom-${{ matrix.name }}", path: "sbom-${{ matrix.name }}.cdx.json" }
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Push multi-arch, tagged by git SHA
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
